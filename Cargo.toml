[package]
name = "gmailfiltermanager"
version = "0.0.1"
edition = "2024"

[dependencies]
oauth2-simple = { git = "https://github.com/glennhartmann/oauth2.git", tag = "v0.0.5" }

clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
reqwest = "0.13.4"
anyhow = "1.0.104"
bon = "3.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "6.0.0"
